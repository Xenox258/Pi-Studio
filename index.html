<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#1b1b1b" />
    <meta name="color-scheme" content="dark" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background-color: #1b1b1b;
        color-scheme: dark;
      }
      #startup-loader {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 42%, rgba(124, 104, 245, 0.08), transparent 28%), #1b1b1b;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .startup-loader__content {
        display: grid;
        justify-items: center;
        gap: 18px;
      }
      .startup-loader__brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .startup-loader__brand svg {
        width: 32px;
        height: 32px;
        color: #b3a4ff;
        transform: rotate(-10deg);
      }
      .startup-loader__status {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #a3a3a3;
        font-size: 13px;
      }
      .startup-loader__spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(179, 164, 255, 0.22);
        border-top-color: #b3a4ff;
        border-radius: 50%;
        animation: startup-loader-spin 800ms linear infinite;
      }
      @keyframes startup-loader-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-loader__spinner { animation: none; }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omp-studio</title>
  </head>
  <body>
    <div id="root"><div id="startup-loader" role="status" aria-live="polite"><div class="startup-loader__content"><div class="startup-loader__brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span>OMP Studio</span></div><div class="startup-loader__status"><span class="startup-loader__spinner" aria-hidden="true"></span><span>Starting workspace…</span></div></div></div></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
