[package]
name = "omp-studio"
version = "0.1.0"
description = "Lightweight desktop interface for OMP"
authors = ["OMP Studio contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "omp_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", default-features = false, features = ["wry"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
tokio = { version = "1.49", default-features = false, features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
thiserror = "2.0"
tracing = "0.1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.21", features = ["v4", "serde"] }
dirs = "6.0"
parking_lot = "0.12"
base64 = "0.22"
tauri-plugin-clipboard-manager = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = "0.38"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
